# Apply Prisma schema to the configured database. This workflow does not seed or delete data.
name: DB Schema Sync

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to apply the current Prisma schema to DATABASE_URL'
        required: true
        default: "NO"

jobs:
  schema:
    if: inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Prisma schema (no seed)
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
